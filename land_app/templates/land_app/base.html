<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LandKart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#0B1120; color:white; }
        .navbar { background:#111827; }
        .navbar-brand { color:#C5A059 !important; font-weight:bold; }
        .btn-gold { background:#C5A059; color:black; font-weight:bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand" href="/">LANDKART</a>

    <div class="collapse navbar-collapse">
        <form class="d-flex mx-auto" method="GET">
            <input class="form-control me-2" type="search" name="q" placeholder="Search land...">
            <button class="btn btn-gold">Search</button>
        </form>

        <a href="/post/" class="btn btn-gold ms-3">Add Land</a>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
