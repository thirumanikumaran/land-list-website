<!DOCTYPE html>
<html>
<head>
    <title>Post Land</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-5 text-white" style="background:#0B1120">

<h2 class="mb-4">Sell Your Land</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- OWNER DETAILS -->
    <input class="form-control mb-3" name="owner_name" placeholder="Owner Name" required>
    <input class="form-control mb-3" name="owner_phone" placeholder="Mobile Number" required>

    <!-- LAND DETAILS -->
    <input class="form-control mb-3" name="title" placeholder="Land Title" required>
    <input type="number" class="form-control mb-3" name="price" placeholder="Price" required>
    <input type="number" class="form-control mb-3" name="area" placeholder="Area (sqft)" required>

    <!-- ✅ MULTIPLE IMAGE UPLOAD -->
    <label class="mb-1">Upload Image 1 (Main Image)</label>
    <input type="file" class="form-control mb-3" name="image1" required>

    <label class="mb-1">Upload Image 2</label>
    <input type="file" class="form-control mb-3" name="image2">

    <label class="mb-1">Upload Image 3</label>
    <input type="file" class="form-control mb-3" name="image3">

    <label class="mb-1">Upload Image 4</label>
    <input type="file" class="form-control mb-3" name="image4">

    <label class="mb-1">Upload Image 5</label>
    <input type="file" class="form-control mb-3" name="image5">

    <!-- MAP COORDINATES -->
    <input class="form-control mb-3" name="lat" placeholder="Latitude (Optional)">
    <input class="form-control mb-3" name="lon" placeholder="Longitude (Optional)">

    <!-- DESCRIPTION -->
    <textarea class="form-control mb-3" name="description" placeholder="Land description"></textarea>

    <button class="btn btn-warning w-100 fw-bold">POST LAND</button>
</form>

</body>
</html>
