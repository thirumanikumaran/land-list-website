<!DOCTYPE html>
<html>
<head>
  <title>My Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      background: #0B1120;
      color: white;
    }
    .cart-card{
      background:#111827;
      border-radius:15px;
      padding:20px;
      margin-bottom:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.5);
    }
    .price{
      color:#C5A059;
      font-size:1.2rem;
      font-weight:bold;
    }
  </style>
</head>
<body class="container py-5">

<h2 class="mb-4 text-center">🛒 My Cart</h2>

{% if lands %}
  {% for land in lands %}
    <div class="cart-card d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-1">{{ land.title }}</h5>
        <div class="price">₹{{ land.price }}</div>
      </div>
      <a href="/land/{{ land.id }}/" class="btn btn-outline-info">View</a>
    </div>
  {% endfor %}
{% else %}
  <p class="text-center">Cart empty 😢</p>
{% endif %}

<div class="text-center mt-4">
  <a href="/" class="btn btn-warning">⬅ Back to Home</a>
</div>

</body>
</html>
